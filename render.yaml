services:
  - type: web
    name: cotizador-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Los valores con sync: false se pegan a mano en el panel de Render (Environment)
      - key: DATABASE_URL
        sync: false # cadena de Neon con postgresql+psycopg://
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # termina en .apps.googleusercontent.com
