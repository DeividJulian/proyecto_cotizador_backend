services:
  - type: web
    name: cotizador-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # se pega a mano en el panel de Render (cadena de Neon con postgresql+psycopg://)
